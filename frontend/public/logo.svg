<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    BookSmith logo：打开的书页 + 锤头（书籍「工坊」意象）。
    主色取主题墨绿系（primary #2f6f5e / light #3d8a75），
    书页暖纸白（bg #f7f5f0），锤柄暖棕（accent #d97742）。
    64 网格、圆角几何块面，缩到 16px favicon 仍可辨认。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8a75"/>
      <stop offset="1" stop-color="#2f6f5e"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2ecdf"/>
    </linearGradient>
  </defs>

  <!-- 圆角方底（应用图标基底，浏览器顶栏深浅背景均可放） -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 打开的书：左右两页微微不对称，中缝下沉（书卷感） -->
  <!-- 左页 -->
  <path d="M12 26 C19 22, 27 22.5, 30.5 26.5 L30.5 44 C27 40.5, 19 40, 12 43.5 Z"
        fill="url(#page)"/>
  <!-- 右页 -->
  <path d="M33.5 26.5 C37 22.5, 45 22, 52 26 L52 43.5 C45 40, 37 40.5, 33.5 44 Z"
        fill="url(#page)"/>
  <!-- 中缝阴影（两页之间的书脊） -->
  <path d="M30.5 26.5 C31.3 27.3, 32.7 27.3, 33.5 26.5 L33.5 44 C32.7 43.4, 31.3 43.4, 30.5 44 Z"
        fill="#c9c2b0" opacity="0.85"/>
  <!-- 页面文字线（暖灰） -->
  <g stroke="#b9b2a0" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M16.5 30.5 C21 28.5, 25.5 29, 28 31"/>
    <path d="M16.5 35 C21 33, 25.5 33.5, 28 35.5"/>
    <path d="M36 31 C38.5 29, 43 28.5, 47.5 30.5"/>
    <path d="M36 35.5 C38.5 33.5, 43 33, 47.5 35"/>
  </g>

  <!-- 锤子：斜置书页右上方，锤头矩形圆角 + 柄（暖棕），叠在书上方表达「打造」 -->
  <g transform="rotate(38 44 18)">
    <!-- 锤柄 -->
    <rect x="42.4" y="10" width="3.2" height="20" rx="1.6" fill="#d97742"/>
    <!-- 锤头（深墨绿） -->
    <rect x="35.5" y="5.5" width="17" height="9.5" rx="3" fill="#1c453a"/>
    <!-- 锤头高光 -->
    <rect x="37" y="7" width="14" height="3" rx="1.5" fill="#2f6f5e"/>
  </g>

  <!-- 敲击火花：锤头右侧三粒小星（浅金，活力点缀） -->
  <g fill="#f4c987" opacity="0.95">
    <circle cx="55.5" cy="10.5" r="1.6"/>
    <circle cx="58.5" cy="15" r="1.3"/>
    <circle cx="53.5" cy="6.5" r="1.2"/>
  </g>
</svg>
