# BookSmith CI：测试 → Docker 镜像构建 → 发布 GHCR
# 远端仓库：https://github.com/guiyuanyuanbao/BookSmith.git
#
# 版本策略（大/中/小版本控制）：
#   - tag v1.2.3  → 镜像标签 1.2.3 / 1.2 / latest（正式发布，大中版本由 tag 决定）
#   - push main   → 镜像标签 0.1.N（N=累计提交数，自动递增）+ main / latest（开发滚动版）
#   - 大/中版本升级：打新 tag（如 v1.3.0）后，后续 main push 自动变为 1.3.N

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # guiyuanyuanbao/booksmith

jobs:
  test:
    name: 测试（Go + 前端类型检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Go 测试
        working-directory: backend
        run: |
          go test ./internal/... -count=1 -v 2>&1 | tee test_output.txt
          EXIT=$?
          # 失败时把最后 80 行贴到 Step Summary，便于无需登录诊断
          tail -n 80 test_output.txt >> $GITHUB_STEP_SUMMARY || true
          exit $EXIT

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端类型检查
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx vue-tsc --noEmit

  docker:
    name: 构建并发布 Docker 镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 发布到 GHCR
    steps:
      # 完整历史：自动版本号需要统计提交数与查找最近 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: ver
        run: |
          set -e
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          COMMITS=$(git rev-list --count HEAD)
          if [[ -n "$LAST_TAG" ]]; then
            BASE="${LAST_TAG#v}"          # 最近语义版本作为大.中版本基线
          else
            BASE="0.1"                    # 尚无 tag：0.1 起步
          fi
          AUTOVER="${BASE}.${COMMITS}"    # 修订号 = main 分支累计提交数，单调递增
          echo "autover=${AUTOVER}" >> $GITHUB_OUTPUT
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
          echo "版本：镜像 ${AUTOVER}（基于 tag: ${LAST_TAG:-无}，提交数 ${COMMITS}）"

      - name: 安装 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.ver.outputs.autover }},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像摘要
        if: github.event_name != 'pull_request'
        run: |
          echo "### 已发布镜像 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for t in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "$t" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "自动版本：${{ steps.ver.outputs.autover }}（最近 tag：${{ steps.ver.outputs.last_tag || '无' }}）" >> $GITHUB_STEP_SUMMARY
