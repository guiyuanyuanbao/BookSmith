# BookSmith CI：测试 → Docker 镜像构建 → 发布 GHCR（可选 Docker Hub）
# 远端仓库：https://github.com/guiyuanyuanbao/BookSmith.git

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # guiyuanyuanbao/booksmith

jobs:
  test:
    name: 测试（Go + 前端类型检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Go 测试
        working-directory: backend
        run: |
          go test ./internal/... -count=1 -v 2>&1 | tee test_output.txt
          EXIT=$?
          # 失败时把最后 80 行贴到 Step Summary，便于无需登录诊断
          tail -n 80 test_output.txt >> $GITHUB_STEP_SUMMARY || true
          exit $EXIT

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端类型检查
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx vue-tsc --noEmit

  docker:
    name: 构建并发布 Docker 镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 发布到 GHCR
    steps:
      - uses: actions/checkout@v4

      - name: 安装 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像摘要
        if: github.event_name != 'pull_request'
        run: |
          echo "### 已发布镜像 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
